[package]
name = "pipewire-dj"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Mix tracks, your mic and app audio into one PipeWire virtual microphone"

[[bin]]
name = "pipewire-dj"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
pipewire = { version = "0.10", features = ["v0_3_49"] }
nnnoiseless = "0.5"
rtrb = "0.4"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "global_shortcuts"] }
futures-util = "0.3"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "process", "fs", "signal"] }
dirs = "6"
regex = "1"

[profile.release]
lto = "thin"
